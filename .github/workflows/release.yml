name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run bootstrap tests
        run: |
          python -m pip install --quiet pytest==8.4.1
          python -m pytest test_bootstrap.py -v

      - name: Build builder-tools stage
        run: docker build --target builder-tools -t opencode-container:builder-tools .

      - name: Verify custom CA bundle build
        run: |
          trap 'rm -f custom-ca.crt /tmp/opencode-custom-ca.key' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/opencode-custom-ca.key -out custom-ca.crt \
            -subj '/CN=opencode-container CI test CA'
          docker build --target builder-tools -t opencode-container:builder-tools-custom-ca .

      - name: Run runtime collector tests
        run: docker run --rm -v "$PWD:/work" -w /work opencode-container:builder-tools-custom-ca bash test_collect_runtime_deps.sh

  build-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Generate release notes
        run: |
          curl -fsSLo /tmp/git-cliff.tar.gz https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  /tmp/git-cliff.tar.gz" | sha512sum -c -
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff
          install -m 0755 "$(find /tmp/git-cliff -name git-cliff -type f | head -n1)" /usr/local/bin/git-cliff
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git-cliff "$PREV_TAG..HEAD" --output release-notes.md
          else
            git-cliff --unreleased --output release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
