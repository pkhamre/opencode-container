name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Run bootstrap tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest test_bootstrap.py -v

      - name: Build builder-tools stage
        run: docker build --target builder-tools -t opencode-container:builder-tools .

      - name: Run runtime collector tests
        run: docker run --rm -v "$PWD:/work" -w /work opencode-container:builder-tools bash test_collect_runtime_deps.sh

  build-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Generate release notes
        run: |
          curl -fsSLo /tmp/git-cliff.tar.gz https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  /tmp/git-cliff.tar.gz" | sha512sum -c -
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff
          install -m 0755 "$(find /tmp/git-cliff -name git-cliff -type f | head -n1)" /usr/local/bin/git-cliff
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git-cliff "$PREV_TAG..HEAD" --output release-notes.md
          else
            git-cliff --unreleased --output release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
